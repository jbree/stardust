<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardust 1.1</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd; font: 13px/1.4 Geneva, Verdana, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; gap: 10px; padding: 12px; box-sizing: border-box; }
  #frame { position: relative; width: min(100%, calc((100vh - 80px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; box-shadow: 0 0 0 1px #444; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; }
  p { margin: 0; color: #999; text-align: center; max-width: 640px; }
  kbd { border: 1px solid #555; border-radius: 3px; padding: 0 4px; color: #ccc; }
</style>
</head>
<body>
<main>
  <div id="frame">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="loading">loading&hellip;</div>
  </div>
  <p>Arrows or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; <kbd>Space</kbd>/<kbd>Return</kbd> is magic &middot;
     <kbd>Space</kbd>/<kbd>Return</kbd>/<kbd>Esc</kbd> on the title screen opens the menu &middot; <kbd>Esc</kbd> pauses a game</p>
</main>
<script>
  var canvas = document.getElementById('canvas');
  var Module = {
    canvas: canvas,
    onRuntimeInitialized: function () { document.getElementById('loading').remove(); canvas.focus(); },
  };
  // Browsers hold audio back until the first key or click; start it then.
  ['keydown', 'mousedown', 'touchstart'].forEach(function (t) {
    window.addEventListener(t, function () {
      var a = Module.SDL2 && Module.SDL2.audioContext;
      if (a && a.state !== 'running') a.resume();
    }, true);
  });
  // Keep the page from scrolling.
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Backspace'].indexOf(e.key) >= 0) e.preventDefault();
  });
</script>
<script async src="stardust.js"></script>
</body>
</html>
